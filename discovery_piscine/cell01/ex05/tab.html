!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 05: Tab</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px; /* Optional: limits the width like the example */
            font-family: sans-serif;
        }
        td {
            border: 1px solid #000000;
            padding: 40px 15px; /* Adjusts the height and spacing inside the boxes */
            width: 50%; /* Gives both boxes an equal width split */
            vertical-align: middle;
        }
        .first-cell {
            background-color: #b3c186; /* Olive/Green color */
        }
        .second-cell {
            background-color: #f7beab; /* Peach/Coral color */
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
