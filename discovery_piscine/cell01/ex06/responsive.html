<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
    <style>
        /* Force html and body to take up the full viewport */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrollbars if you want it locked to the screen size */
            font-family: Arial, sans-serif;
        }

        /* Make the table cover the entire web page */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* Ensures cells scale proportionally */
        }

        /* Style the table cells so they fill space and shrink/grow */
        td, th {
            border: 2px solid #333;
            text-align: center;
            vertical-align: middle;
            padding: 10px;
            /* Use clamp() or responsive font sizing so text shrinks with the window */
            font-size: 3vw; 
        }

        /* Optional: Add some background colors or styling to make it look cool */
        tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }

        tr:nth-child(even) td {
            background-color: #e9e9e9;
        }
    </style>
</head>
<body>

    <!-- Table covering the entire page and shrinking on resize -->
    <table>
        <tr>
            <td>Cell 1-1</td>
            <td>Cell 1-2</td>
            <td>Cell 1-3</td>
        </tr>
        <tr>
            <td>Cell 2-1</td>
            <td>Cell 2-2</td>
            <td>Cell 2-3</td>
        </tr>
        <tr>
            <td>Cell 3-1</td>
            <td>Cell 3-2</td>
            <td>Cell 3-3</td>
        </tr>
    </table>

</body>
</html>
